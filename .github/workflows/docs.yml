name: documentation
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-python@v5
            with:
              python-version: 3.13
          - run: pip3 install zensical zensical-alloy mkdocstrings mkdocstrings-python ghp-import
          - run: pip3 install --editable .
          - run: zensical --version
          - run: zensical build --clean
          - run: ghp-import --no-jekyll --push --force site


